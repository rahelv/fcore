<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Search</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --border:   #2a2a2a;
    --accent:   #c8f135;
    --text:     #e8e8e8;
    --muted:    #666;
    --radius:   6px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 48px 32px;
  }

  header {
    max-width: 900px;
    margin: 0 auto 48px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  header h1 {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  header span {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* Search bar */
  .search-wrap {
    max-width: 900px;
    margin: 0 auto 48px;
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .search-wrap:focus-within {
    border-color: var(--accent);
  }

  #query {
    flex: 1;
    background: var(--surface);
    border: none;
    outline: none;
    padding: 14px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--text);
  }

  #query::placeholder { color: var(--muted); }

  .top-k-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 0 16px;
    gap: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
  }

  #top_k {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    width: 40px;
    text-align: center;
  }

  #search-btn {
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    padding: 14px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  #search-btn:hover { opacity: 0.85; }
  #search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Status bar */
  #status {
    max-width: 900px;
    margin: 0 auto 24px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 18px;
  }

  #status.error { color: #ff6b6b; }

  /* Grid */
  #grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2px;
  }

  .card {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.3s forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .card:hover img { transform: scale(1.04); }

  .card-info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 24px 10px 10px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .card:hover .card-info { transform: translateY(0); }

  .card-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .card-score {
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: #fff;
  }

  .card-path {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>CLIP Search</h1>
  <span>cosine similarity · pgvector</span>
</header>

<div class="search-wrap">
  <input id="query" type="text" placeholder="Describe an image — e.g. a dog on a beach at sunset" autocomplete="off" />
  <div class="top-k-wrap">
    top <input id="top_k" type="number" value="20" min="1" max="100" /> results
  </div>
  <button id="search-btn">Search</button>
</div>

<div id="status"></div>
<div id="grid"></div>

<script>
  const queryEl  = document.getElementById('query');
  const btn      = document.getElementById('search-btn');
  const topKEl   = document.getElementById('top_k');
  const statusEl = document.getElementById('status');
  const gridEl   = document.getElementById('grid');

  async function search() {
    const query = queryEl.value.trim();
    if (!query) return;

    btn.disabled = true;
    gridEl.innerHTML = '';
    statusEl.className = '';
    statusEl.innerHTML = '<span class="spinner"></span>Searching…';

    try {
      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, top_k: parseInt(topKEl.value) }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const results = await res.json();

      if (results.error) throw new Error(results.error);
      if (results.length === 0) {
        statusEl.textContent = 'No results found.';
        return;
      }

      statusEl.textContent = `${results.length} results for "${query}"`;

      results.forEach((r, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 20}ms`;
        card.innerHTML = `
          <img src="${r.image}" alt="${r.label}" loading="lazy" />
          <div class="card-info">
            <div class="card-label">${r.label}</div>
            <div class="card-score">${(r.similarity * 100).toFixed(1)}% match</div>
            <div class="card-path">${r.filepath.split('/').slice(-2).join('/')}</div>
          </div>
        `;
        gridEl.appendChild(card);
      });

    } catch (err) {
      statusEl.className = 'error';
      statusEl.textContent = `Error: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', search);
  queryEl.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
