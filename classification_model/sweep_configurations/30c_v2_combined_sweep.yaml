# Combined sweep: phase 1 (core dynamics) + phase 2 (regularisation & augmentation)
# in one search, with cutmix and color jitter toggleable (0.0 / "none" = off).
# Intended for 4 GPUs: run one agent per GPU, run_cap stops the sweep globally.

program: train.py
project: fcore_hyperparam_sweep_4_combined
entity: rahelvalerie-universit-t-basel

method: bayes

metric:
  name: val/accuracy
  goal: maximize

# discrete space: 2 (wd) x 3 (dropout) x 3 (ls) x 3 (jitter) x 2 (rotation)
# x 2 (erasing) x 3 (cutmix) = 648 combos + continuous lr
# batch_size and crop_scale_min locked from phase 1 results.
run_cap: 100

parameters:
  save_dir:
    value: /home/ubuntu/data/models/fcore_hyperparam_sweep_4_combined
  data_dir:
    value: /home/ubuntu/data/robust_dataset_split_30c_v2

  # ── run control ────────────────────────
  max_epochs:
    value: 120
  min_epochs:
    value: 40
  patience:
    value: 15

  # ── optimiser (phase 1 axes) ───────────
  lr:
    distribution: log_uniform_values
    min: 0.0003
    max: 0.003
  weight_decay:
    # 1e-5 dropped (weak in phase 1)
    values: [0.0001, 0.001]
  batch_size:
    # locked from phase 1 (dominant in top-15)
    value: 32
  crop_scale_min:
    # locked from phase 1 (11/15 top runs)
    value: 0.65

  # ── regularisation (phase 2 axes) ──────
  dropout_p:
    values: [0.0, 0.2, 0.4]
  label_smoothing:
    # 0.15 dropped — adjacent values nearly indistinguishable
    values: [0.05, 0.1, 0.2]

  # ── augmentation ───────────────────────
  jitter_strength:
    # none → ColorJitter disabled entirely
    values: [none, mild, strong]
  rotation_degrees:
    # on/off question first; 10-vs-20 refinement deferred
    values: [0, 15]
  aug_erasing:
    values: [true, false]

  # ── cutmix ─────────────────────────────
  cutmix_alpha:
    # 0.0 → CutMix disabled; else Beta(alpha, alpha) lambda sampling
    values: [0.0, 0.3, 0.6]
