# v3: one consolidated sweep over everything still unresolved after
# S1 (21c), S2 (30c), phase 1 (3a) and phase 2 (3b / 3b_cutmix).
#
# Fixed on strong evidence:
#   optimizer adamW, scheduler plateau (patience 5, factor 0.5)  — S1
#   hflip on; grayscale/blur/perspective off                     — S1/S2
#   label_smoothing 0.1 (14/15 S1 top runs; 0.2 never beat it)
#   weight_decay 1e-5 dropped (3/15 in clean phase-1 runs)
#
# Re-opened despite earlier locks:
#   batch_size    — phase-1 edge for 32 was 8/15, a coin flip
#   crop_scale_min — S2 favoured 0.80, phase 1 favoured 0.65: unresolved
#
# Longer schedule (150 epochs): heavy regularisation (cutmix etc.) needs
# long runs to show benefit (cf. "ResNet Strikes Back", timm recipes);
# short-schedule bias was the main flaw of the earlier sweeps.
#
# No early_terminate/hyperband on purpose: it kills slow-starting runs,
# and heavily regularised configs are slow starters.
#
# 6 GPUs: one agent per GPU, run_cap stops the sweep globally.
#   wandb sweep sweep_configurations/fcore_hyperparam_sweep_v3.yaml
#   CUDA_VISIBLE_DEVICES=n wandb agent <entity>/<project>/<sweep_id>

program: train.py
project: fcore_hyperparam_sweep_v3
entity: rahelvalerie-universit-t-basel

method: bayes

metric:
  name: val/accuracy
  goal: maximize

# discrete space: 2 (wd) x 2 (bs) x 2 (crop) x 3 (dropout) x 3 (jitter)
# x 3 (rotation) x 2 (erasing) x 4 (cutmix) = 1728 combos + continuous lr
# 240 runs = 40 per GPU; scale run_cap to the wall-clock you can afford.
run_cap: 240

parameters:
  save_dir:
    value: /home/ubuntu/data/models/fcore_hyperparam_sweep_v3
  data_dir:
    value: /home/ubuntu/data/robust_dataset_split_30c_v2

  # ── run control ────────────────────────
  max_epochs:
    # raised from 120: regularised runs need the headroom
    value: 150
  min_epochs:
    value: 40
  patience:
    value: 20

  # ── optimiser ──────────────────────────
  lr:
    # ceiling 2x phase-2 (3e-3) since batch_size 64 is back in play
    # (linear scaling); grad clipping guards the high-lr regime
    distribution: log_uniform_values
    min: 0.0003
    max: 0.006
  weight_decay:
    values: [0.0001, 0.001]
  batch_size:
    # re-opened: phase-1 evidence (8/15 for 32) too weak to lock
    values: [32, 64]

  # ── preprocessing ──────────────────────
  crop_scale_min:
    # re-opened: S2 (0.80) and phase 1 (0.65) disagree
    values: [0.65, 0.8]

  # ── regularisation ─────────────────────
  dropout_p:
    values: [0.0, 0.2, 0.4]
  label_smoothing:
    # fixed: dominated S1 top-15 (14/15); 0.2 never beat it in phase 2
    value: 0.1

  # ── augmentation ───────────────────────
  jitter_strength:
    # none → ColorJitter disabled entirely
    values: [none, mild, strong]
  rotation_degrees:
    # same levels as phase 2 for comparability
    values: [0, 10, 20]
  aug_erasing:
    values: [true, false]

  # ── cutmix ─────────────────────────────
  cutmix_alpha:
    # 0.0 → off; nonzero values match the phase-2 cutmix sweep
    values: [0.0, 0.2, 0.4, 0.6]
