# C10-Character-Pretrained: ImageNet init, fine-tuned on character artwork only.
# Same s8i1hx30 hyperparameters as the from-scratch run — only init differs.
#   python3 train_domain_transfer.py --config configs/c10_character_pretrained.yaml

project: fcore_domain_transfer
entity: rahelvalerie-universit-t-basel
run_name: C10-Character-Pretrained

save_dir: /home/ubuntu/data/models/fcore_domain_transfer
train_dir: /home/ubuntu/data/domain_transfer_10c_split/train_character
val_dir:   /home/ubuntu/data/domain_transfer_10c_split/val
test_dir:  /home/ubuntu/data/domain_transfer_10c_split/test

max_epochs: 150
min_epochs: 40
patience: 20

pretrained: true    # ImageNet weights
source_run: s8i1hx30

lr: 0.0010703426629131445
weight_decay: 0.001
batch_size: 32
crop_scale_min: 0.65
dropout_p: 0.2
label_smoothing: 0.2
jitter_strength: strong
rotation_degrees: 10
aug_erasing: false
cutmix_alpha: 0.6
