# C10-Cosplay→Character-Pretrained: initialise from C10-Cosplay-Pretrained
# checkpoint (itself ImageNet-initialised), then fine-tune on character at lr/10.
# Requires C10-Cosplay-Pretrained to have finished first.
#   python3 train_domain_transfer.py --config configs/c10_cosplay_to_character_pretrained.yaml

project: fcore_domain_transfer
entity: rahelvalerie-universit-t-basel
run_name: C10-Cosplay-to-Character-Pretrained

save_dir: /home/ubuntu/data/models/fcore_domain_transfer
init_checkpoint: /home/ubuntu/data/models/fcore_domain_transfer/C10-Cosplay-Pretrained_best.pt

train_dir: /home/ubuntu/data/domain_transfer_10c_split/train_character
val_dir:   /home/ubuntu/data/domain_transfer_10c_split/val
test_dir:  /home/ubuntu/data/domain_transfer_10c_split/test

max_epochs: 150
min_epochs: 40
patience: 20

pretrained: false   # weights come from init_checkpoint (ImageNet→cosplay), not directly from ImageNet
source_run: fiery-sweep-6

lr: 0.00004421768400778447   # fiery-sweep-6 lr / 10 for fine-tuning
weight_decay: 0.001
batch_size: 32
crop_scale_min: 0.65
dropout_p: 0.2
label_smoothing: 0.2
jitter_strength: strong
rotation_degrees: 0
aug_erasing: false
cutmix_alpha: 0.6
