<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosplay Recognition — Model Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0e;
      --surface:  #141417;
      --surface2: #1c1c21;
      --border:   #2a2a32;
      --text:     #e8e8f0;
      --accent:   #a78bfa;
      --correct:  #34d399;
      --wrong:    #f87171;
      --bar-bg:   #252530;
      --bar-a:    #818cf8;
      --bar-b:    #fb923c;
      --font-head:'Syne', sans-serif;
      --font-mono:'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    header {
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    header p { font-size: 0.78rem; color: #555566; margin-top: 0.3rem; }

    .controls {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #0c0c0e; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn:hover:not(:disabled) { opacity: 0.8; }

    .upload-label {
      font-size: 0.78rem;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text);
      transition: opacity 0.15s;
    }
    .upload-label:hover { opacity: 0.8; }
    #file-input { display: none; }

    .divider {
      font-size: 0.7rem;
      color: #444455;
    }

    #status {
      font-size: 0.72rem;
      color: #555566;
      margin-left: auto;
    }

    #result {
      padding: 2rem;
      display: none;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      max-width: 1100px;
    }

    .cell {
      background: var(--surface);
      padding: 1.5rem;
    }

    .cell-img {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .cell-img img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .ground-truth {
      text-align: center;
    }
    .ground-truth .gt-label {
      font-size: 0.62rem;
      color: #444455;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.3rem;
    }
    .ground-truth .gt-value {
      font-size: 0.8rem;
      color: #facc15;
    }

    .model-header {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .model-header.a { color: var(--bar-a); }
    .model-header.b { color: var(--bar-b); }

    .pred-list { display: flex; flex-direction: column; gap: 0.9rem; }

    .pred-row {}
    .pred-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }
    .pred-name {
      font-size: 0.75rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72%;
    }
    .pred-name.correct { color: var(--correct); }
    .pred-conf { font-size: 0.7rem; color: #666677; flex-shrink: 0; }

    .bar-track {
      height: 6px;
      background: var(--bar-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
      width: 0;
    }
    .bar-fill.a         { background: var(--bar-a); }
    .bar-fill.b         { background: var(--bar-b); }
    .bar-fill.correct   { background: var(--correct) !important; }
    .bar-fill.rank-1    { opacity: 0.55; }
    .bar-fill.rank-2    { opacity: 0.3;  }

    .verdict {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.68rem;
    }
    .verdict.ok   { color: var(--correct); }
    .verdict.fail { color: var(--wrong);   }

    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: #333344;
      font-size: 0.85rem;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #333344;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Cosplay Recognition</h1>
    <p>Model 32 vs Model 32 with Pretrained Weights &nbsp;·&nbsp; top-3 predictions</p>
  </div>
</header>

<div class="controls">
  <button class="btn btn-primary" id="btn-random">Random val image</button>
  <span class="divider">or</span>
  <label class="upload-label" for="file-input">Upload image</label>
  <input type="file" id="file-input" accept="image/*" />
  <span id="status"></span>
</div>

<div id="result">
  <div class="result-grid">
    <div class="cell cell-img">
      <img id="preview" src="" alt="input image" />
      <div class="ground-truth" id="gt-block" style="display:none">
        <span class="gt-label">ground truth</span>
        <span class="gt-value" id="gt-value"></span>
      </div>
    </div>
    <div class="cell" id="cell-a">
      <div class="model-header a">Model 32</div>
      <div class="pred-list" id="preds-a"></div>
      <div class="verdict" id="verdict-a"></div>
    </div>
    <div class="cell" id="cell-b">
      <div class="model-header b">Model 32 · pretrained weights</div>
      <div class="pred-list" id="preds-b"></div>
      <div class="verdict" id="verdict-b"></div>
    </div>
  </div>
</div>

<div class="empty" id="empty">Press "Random val image" or upload a photo to get predictions.</div>

<script>
  const btnRandom  = document.getElementById('btn-random');
  const fileInput  = document.getElementById('file-input');
  const status     = document.getElementById('status');
  const resultDiv  = document.getElementById('result');
  const emptyDiv   = document.getElementById('empty');
  const preview    = document.getElementById('preview');
  const gtBlock    = document.getElementById('gt-block');
  const gtValue    = document.getElementById('gt-value');
  const predsA     = document.getElementById('preds-a');
  const predsB     = document.getElementById('preds-b');
  const verdictA   = document.getElementById('verdict-a');
  const verdictB   = document.getElementById('verdict-b');

  function setLoading(yes) {
    btnRandom.disabled = yes;
    status.innerHTML   = yes ? '<span class="spinner"></span> running inference…' : '';
  }

  function buildPreds(container, preds, trueLabel, modelClass) {
    container.innerHTML = '';
    preds.forEach((p, i) => {
      const isCorrect = trueLabel && p.label === trueLabel;
      const short     = p.label.length > 28 ? p.label.slice(0,26)+'…' : p.label;
      const row = document.createElement('div');
      row.className = 'pred-row';
      row.innerHTML = `
        <div class="pred-meta">
          <span class="pred-name${isCorrect ? ' correct' : ''}">${short}</span>
          <span class="pred-conf">${p.confidence.toFixed(1)}%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill ${modelClass} rank-${i}${isCorrect ? ' correct' : ''}"
               data-w="${p.confidence}" style="width:0%"></div>
        </div>`;
      container.appendChild(row);
    });
    // animate bars after paint
    requestAnimationFrame(() => {
      container.querySelectorAll('.bar-fill').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
    });
  }

  function buildVerdict(el, preds, trueLabel) {
    if (!trueLabel) { el.textContent = ''; return; }
    const top1 = preds[0].label;
    if (top1 === trueLabel) {
      el.className = 'verdict ok';
      el.textContent = '✓ correct';
    } else {
      el.className = 'verdict fail';
      const short = top1.length > 22 ? top1.slice(0,20)+'…' : top1;
      el.textContent = `✗ predicted "${short}"`;
    }
  }

  function render(data) {
    preview.src = 'data:image/jpeg;base64,' + data.image;

    if (data.true_label) {
      gtBlock.style.display = 'block';
      gtValue.textContent   = data.true_label;
    } else {
      gtBlock.style.display = 'none';
    }

    buildPreds(predsA, data.preds_a, data.true_label, 'a');
    buildPreds(predsB, data.preds_b, data.true_label, 'b');
    buildVerdict(verdictA, data.preds_a, data.true_label);
    buildVerdict(verdictB, data.preds_b, data.true_label);

    emptyDiv.style.display  = 'none';
    resultDiv.style.display = 'block';
  }

  async function fetchRandom() {
    setLoading(true);
    try {
      const res  = await fetch('/api/random');
      const data = await res.json();
      render(data);
    } catch(e) {
      status.textContent = 'Error — is the server running?';
    } finally {
      setLoading(false);
    }
  }

  async function uploadFile(file) {
    setLoading(true);
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      render(data);
    } catch(e) {
      status.textContent = 'Error — is the server running?';
    } finally {
      setLoading(false);
    }
  }

  btnRandom.addEventListener('click', fetchRandom);
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) uploadFile(e.target.files[0]);
  });
</script>
</body>
</html>
